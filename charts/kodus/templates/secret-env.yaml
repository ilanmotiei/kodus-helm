{{- /*
Shared Secret loaded into every app pod via envFrom.

Sources, in increasing precedence:
  1. Auto-generated random crypto secrets (stable across upgrades via lookup
     of the existing Secret on the cluster). Only kicks in if .Values.autoGenerateSecrets.
  2. Auto-derived DB / MQ credentials when the bundled stateful services are
     enabled.
  3. .Values.llm.* (LLM provider key, mapped to the right Kodus env var).
  4. .Values.github.* (OAuth + App credentials).
  5. .Values.secrets.*  (raw env-var dump — full escape hatch).
  6. .Values.extraSecrets (top-level overrides on top of everything).
*/ -}}

{{/* ---- Service-credential auto-derivation ---- */}}
{{- $pgPass := default "" .Values.postgresql.auth.password -}}
{{- $mgPass := default "" .Values.mongodb.auth.password -}}
{{- $mqUser := default "" .Values.rabbitmq.auth.username -}}
{{- $mqPass := default "" .Values.rabbitmq.auth.password -}}
{{- $mqVhost := default "kodus-ai" .Values.rabbitmq.auth.vhost -}}

{{- $svcSecrets := dict -}}
{{- if .Values.postgresql.enabled -}}
  {{- $_ := set $svcSecrets "API_PG_DB_PASSWORD" $pgPass -}}
  {{- $_ := set $svcSecrets "DATABASE_URL" (printf "postgres://%s:%s@%s:%v/%s" (include "kodus.pg.username" .) $pgPass (include "kodus.pg.host" .) (include "kodus.pg.port" .) (include "kodus.pg.database" .)) -}}
{{- end -}}
{{- if .Values.mongodb.enabled -}}
  {{- $_ := set $svcSecrets "API_MG_DB_PASSWORD" $mgPass -}}
  {{- $_ := set $svcSecrets "MONGODB_URI" (printf "mongodb://%s:%s@%s:%v/%s?authSource=admin" (include "kodus.mg.username" .) $mgPass (include "kodus.mg.host" .) (include "kodus.mg.port" .) (include "kodus.mg.database" .)) -}}
{{- end -}}
{{- if .Values.rabbitmq.enabled -}}
  {{- $_ := set $svcSecrets "RABBITMQ_DEFAULT_USER" $mqUser -}}
  {{- $_ := set $svcSecrets "RABBITMQ_DEFAULT_PASS" $mqPass -}}
  {{- $_ := set $svcSecrets "API_RABBITMQ_URI" (printf "amqp://%s:%s@%s:%v/%s?heartbeat=60" $mqUser $mqPass (include "kodus.mq.host" .) .Values.rabbitmq.service.amqpPort $mqVhost) -}}
{{- end -}}

{{/* ---- LLM helper ---- */}}
{{/*
Kodus's Claude branch in byok-to-vercel.ts reuses API_OPEN_AI_API_KEY as the
Anthropic key. We hide that here so users just set llm.apiKey and don't have
to know which env var Kodus actually reads for which provider.
*/}}
{{- $llmSecrets := dict -}}
{{- $provider := default "auto" .Values.llm.provider -}}
{{- $apiKey   := default "" .Values.llm.apiKey -}}
{{- if and (ne $provider "auto") $apiKey -}}
  {{- if eq $provider "anthropic" -}}
    {{- $_ := set $llmSecrets "API_OPEN_AI_API_KEY" $apiKey -}}
    {{- $_ := set $llmSecrets "API_ANTHROPIC_API_KEY" $apiKey -}}
  {{- else if or (eq $provider "openai") (eq $provider "openrouter") (eq $provider "groq") (eq $provider "cerebras") (eq $provider "novita") (eq $provider "custom") -}}
    {{- $_ := set $llmSecrets "API_OPEN_AI_API_KEY" $apiKey -}}
  {{- else if eq $provider "gemini" -}}
    {{- $_ := set $llmSecrets "API_GOOGLE_AI_API_KEY" $apiKey -}}
    {{- $_ := set $llmSecrets "GEMINI_API_KEY" $apiKey -}}
  {{- else if eq $provider "vertex" -}}
    {{- $_ := set $llmSecrets "API_VERTEX_AI_API_KEY" $apiKey -}}
  {{- end -}}
{{- end -}}

{{/* ---- MCP helper ---- */}}
{{- $mcpSecrets := dict -}}
{{- if and .Values.mcp.enabled .Values.mcp.composio.apiKey -}}
  {{- $_ := set $mcpSecrets "API_MCP_MANAGER_COMPOSIO_API_KEY" .Values.mcp.composio.apiKey -}}
{{- end -}}

{{/* ---- GitHub helper ---- */}}
{{- $ghSecrets := dict -}}
{{- if .Values.github.oauth.enabled -}}
  {{- with .Values.github.oauth.clientId     }}{{ $_ := set $ghSecrets "WEB_OAUTH_GITHUB_CLIENT_ID"     . }}{{ end -}}
  {{- with .Values.github.oauth.clientSecret }}{{ $_ := set $ghSecrets "WEB_OAUTH_GITHUB_CLIENT_SECRET" . }}{{ end -}}
{{- end -}}
{{- if .Values.github.app.enabled -}}
  {{- with .Values.github.app.appId        }}{{ $_ := set $ghSecrets "API_GITHUB_APP_ID"        . }}{{ end -}}
  {{- with .Values.github.app.clientId     }}{{ $_ := set $ghSecrets "GLOBAL_GITHUB_CLIENT_ID"  . }}{{ end -}}
  {{- with .Values.github.app.clientSecret }}{{ $_ := set $ghSecrets "API_GITHUB_CLIENT_SECRET" . }}{{ end -}}
  {{- with .Values.github.app.privateKey   }}{{ $_ := set $ghSecrets "API_GITHUB_PRIVATE_KEY"   . }}{{ end -}}
{{- end -}}
{{- with .Values.github.pat -}}
  {{- $_ := set $ghSecrets "GITHUB_TOKEN" . -}}
{{- end -}}

{{/* ---- Auto-generated crypto secrets (stable across helm upgrade) ---- */}}
{{/*
Look up the existing Secret first; if a key is already set, keep its value so
JWTs/refresh tokens etc. stay valid. For first install, generate fresh random
values. Users can always override via .Values.secrets.<KEY>.
*/}}
{{- $autoCrypto := dict -}}
{{- if .Values.autoGenerateSecrets -}}
  {{- $existing := dict -}}
  {{- $found := lookup "v1" "Secret" .Release.Namespace (include "kodus.envSecret" .) -}}
  {{- if and $found $found.data -}}{{ $existing = $found.data }}{{ end -}}
  {{- range $key := list "API_JWT_SECRET" "API_JWT_REFRESH_SECRET" "API_JWT_REFRESHSECRET" "WEB_NEXTAUTH_SECRET" "NEXTAUTH_SECRET" "WEB_JWT_SECRET_KEY" -}}
    {{- $existingVal := "" -}}
    {{- with index $existing $key -}}{{ $existingVal = (b64dec .) }}{{ end -}}
    {{- $_ := set $autoCrypto $key (default (randAlphaNum 48) $existingVal) -}}
  {{- end -}}
  {{- range $key := list "API_CRYPTO_KEY" "CODE_MANAGEMENT_SECRET" "API_MCP_MANAGER_ENCRYPTION_SECRET" "API_MCP_MANAGER_JWT_SECRET" -}}
    {{- $existingVal := "" -}}
    {{- with index $existing $key -}}{{ $existingVal = (b64dec .) }}{{ end -}}
    {{- $_ := set $autoCrypto $key (default (randAlphaNum 64) $existingVal) -}}
  {{- end -}}
  {{/* Webhook token: URL-safe base64 (matches kodus-installer's generate-secrets.sh). */}}
  {{- $existingWHT := "" -}}
  {{- with index $existing "CODE_MANAGEMENT_WEBHOOK_TOKEN" -}}{{ $existingWHT = (b64dec .) }}{{ end -}}
  {{- $_ := set $autoCrypto "CODE_MANAGEMENT_WEBHOOK_TOKEN" (default (randAlphaNum 48) $existingWHT) -}}
{{- end -}}

{{/* ---- Compose all sources by precedence ---- */}}
{{- $merged := merge dict .Values.extraSecrets .Values.secrets $ghSecrets $mcpSecrets $llmSecrets $svcSecrets $autoCrypto -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kodus.envSecret" . }}
  labels:
    {{- include "kodus.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := $merged }}
  {{- if and (ne (printf "%v" $v) "") (not (kindIs "invalid" $v)) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
