apiVersion: v2
name: kodus
description: Kodus AI — self-hosted AI code review platform (api, worker, webhooks, web, optional mcp-manager and AST service) with bundled Postgres/MongoDB/RabbitMQ.
type: application
version: 0.2.0
appVersion: "latest"
icon: https://kodus.io/wp-content/uploads/2025/04/kodusinstaller.png
home: https://kodus.io
sources:
  - https://github.com/ilanmotiei/kodus-helm
  - https://github.com/kodustech/kodus-ai
  - https://github.com/kodustech/kodus-installer
keywords:
  - kodus
  - code-review
  - ai
  - llm
  - github
  - gitlab
  - claude
  - gpt
  - gemini
maintainers:
  - name: ilanmotiei
    url: https://github.com/ilanmotiei
annotations:
  artifacthub.io/category: integration-and-delivery
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Kodus AI source
      url: https://github.com/kodustech/kodus-ai
    - name: Kodus AI docs
      url: https://docs.kodus.io
    - name: Helm chart source
      url: https://github.com/ilanmotiei/kodus-helm
  artifacthub.io/changes: |
    - kind: added
      description: "`mcp.*` helper toggles mcpManager.enabled and wires every API_MCP_* / WEB_*_MCP_MANAGER env var the api / worker / mcp-manager / web pods need. One knob to enable MCP integrations (Composio, custom MCP servers, kodusmcp)."
    - kind: added
      description: "`mcp.composio.apiKey` value maps to API_MCP_MANAGER_COMPOSIO_API_KEY for the Composio aggregator path."
    - kind: added
      description: "docs/KNOWN-ISSUES.md catalogs the upstream Kodus quirks the chart compensates for, so users don't waste time hitting them."
    - kind: changed
      description: "mcp-manager Deployment is rendered when either `mcpManager.enabled` or `mcp.enabled` is true (the latter is the new preferred toggle)."
