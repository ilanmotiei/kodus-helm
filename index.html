<h1>Kodus AI Helm chart repository</h1>
<p>Add this Helm repo:</p>
<pre><code>helm repo add kodus https://ilanmotiei.github.io/kodus-helm
helm repo update</code></pre>
<p>Then install:</p>
<pre><code>helm install kodus kodus/kodus -n kodus --create-namespace -f my-values.yaml</code></pre>
<p>Source &amp; docs: <a href="https://github.com/ilanmotiei/kodus-helm">github.com/ilanmotiei/kodus-helm</a></p>
